<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      §10.117: the icon is `portfolio/web/favicon.png`, copied byte-identical
      (md5 e9f2df5892d2fd3d1f5e71967cd8d729).

      **It was the Vite template's lightning bolt until now**, which is a scaffold
      artefact and not a design decision anyone made -- `index.html` shipped with
      `/favicon.svg` and nothing had questioned it since `vite create`.

      The source asset is worth describing because it is not what the rest of the
      original repo suggests. `web/favicon.png` is a **white blocky glyph on
      opaque black** and it was **put there on purpose** -- git shows it growing
      917 -> 6431 bytes in 554e853, so it replaced a placeholder rather than
      arriving as the default. By contrast every *other* icon in the Flutter repo
      is untouched stock Flutter: `web/icons/Icon-{192,512}.png`,
      `Icon-maskable-*`, and the iOS and macOS app icon sets all carry the
      two-tone Flutter bird (#54c5f8 / #01579b).

      Which is why there is deliberately **no `apple-touch-icon` and no
      `manifest.json` here**, though the Flutter `web/index.html` has both. Matching
      the original in those two places would mean shipping the Flutter bird into
      the tab bar on iOS and onto the home screen -- a strictly worse icon than the
      one the tab already shows, in exchange for a PWA install prompt this app has
      no service worker to honour. The ask was the *browser tab*; this is the
      browser tab.

      The SVG form is gone rather than kept as a second `<link>`. Only the PNG
      matches the original, and a `<link rel="icon">` pair with different artwork
      is a coin flip decided by browser sniffing order.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 10.17: the Flutter build ships no viewport meta and falls back to a
         980px layout viewport, which degrades the portrait experience. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      §10.119: "Sarim's Portfolio".

      §10.117 kept the Flutter build's own title -- `portfolio`, which both
      `web/index.html` and `manifest.json` carry -- on the grounds that
      matching the original was the job. The owner has now overridden it. The
      original's title is one word and says nothing about who the site is
      about; this one does. Recorded as a deliberate divergence, not an
      oversight.
    -->
    <title>Sarim's Portfolio</title>
    <style>html,body{background-color:#000}</style>
    <script type="module" crossorigin src="/assets/index-uGK2xhvR.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DMgUzzDQ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
